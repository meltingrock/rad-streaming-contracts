name: contracts-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify wheel bundles schemas
        working-directory: conformance
        run: pip install build && bash scripts/verify_wheel.sh
      - name: Schemas are valid Draft 2020-12 schemas
        run: python -c "import glob, json, jsonschema; [jsonschema.Draft202012Validator.check_schema(json.load(open(f))) or print(f, 'OK') for f in sorted(glob.glob('src/hourplan_conformance/schemas/*.schema.json'))]"
      - name: Generate models (codegen must succeed)
        run: ../codegen/generate_pydantic.sh
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Conformance suite
        run: pytest -v
